[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-crowd"
version = "2.0.0"
description = "Adaptive virtual crowd & in-app UX funnel simulation (1,000-25,000+ personas) for SaaS, apps, e-commerce & dropshipping."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "SamuelCoreLabs" }]
keywords = [
    "crowd-simulation",
    "ux-funnel",
    "ecommerce",
    "dropshipping",
    "ai-agents",
    "agent-skills",
    "market-research",
    "monte-carlo",
    "product-validation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SamuelCoreLabs/pulse-crowd"
Repository = "https://github.com/SamuelCoreLabs/pulse-crowd"
"Live Demo" = "https://samuelcorelabs.github.io/pulse-crowd/"
Issues = "https://github.com/SamuelCoreLabs/pulse-crowd/issues"
Changelog = "https://github.com/SamuelCoreLabs/pulse-crowd/blob/main/CHANGELOG.md"

[project.scripts]
pulse-crowd-size = "pulse_crowd.size_swarm:main"
pulse-crowd-sim = "pulse_crowd.simulate_crowd:main"

[tool.setuptools]
packages = ["pulse_crowd"]

[tool.setuptools.package-dir]
pulse_crowd = "scripts"
