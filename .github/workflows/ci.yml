name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate SKILL.md & repository structure
        run: python scripts/validate_skill.py

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Validate JSON example specs
        run: |
          python -m json.tool examples/minimal-b2b-cli.json > /dev/null
          python -m json.tool examples/regulated-marketplace.json > /dev/null

      - name: Smoke test — adaptive sizing engine
        run: |
          python scripts/size_swarm.py --spec examples/minimal-b2b-cli.json
          python scripts/size_swarm.py --spec examples/regulated-marketplace.json

      - name: Smoke test — 3-round crowd simulation
        run: |
          python scripts/simulate_crowd.py \
            --spec examples/minimal-b2b-cli.json \
            --out-dir /tmp/ci_smoke_min \
            --runs 2 \
            --seed 42
          python scripts/simulate_crowd.py \
            --spec examples/regulated-marketplace.json \
            --out-dir /tmp/ci_smoke_reg \
            --runs 2 \
            --seed 42
          test -f /tmp/ci_smoke_min/metrics.json
          test -f /tmp/ci_smoke_reg/report.md

      - name: Verify pip package & CLI entry points
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --no-deps .
          pulse-crowd-size --spec examples/minimal-b2b-cli.json > /dev/null
          pulse-crowd-sim --spec examples/minimal-b2b-cli.json --out-dir /tmp/ci_pip_smoke --runs 1 --seed 42
          test -f /tmp/ci_pip_smoke/metrics.json
