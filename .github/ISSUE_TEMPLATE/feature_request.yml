name: Feature Request
description: Suggest an improvement, new spec example, export format, or agent integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **pulse-crowd** better? Note that core scripts must stay strictly within the **Python 3.9+ standard library** (zero external runtime dependencies).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What product launch, pricing, compliance, or workflow problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work (CLI flags, schema fields, demo feature, etc.)?
    validations:
      required: true
